[project]
name = "justfastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.1",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary,pool]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy==2.1.6",
]

[project.scripts]
justfastapi = "justfastapi:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
]
[tool.poe.tasks]
dev = "fastapi dev src/justfastapi/main.py"
start = "uvicorn justfastapi.main:app"
